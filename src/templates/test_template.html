<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to ShopBeta</title>
</head>
<body style="margin: 0; padding: 48px 24px; background-color: #ffffff; font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1.7; color: #1a1a1a;">

  <div style="max-width: 520px; margin: 0 auto;">

    <p style="margin: 0 0 20px 0;">Hi {{ FIRST_NAME }},</p>

    <p style="margin: 0 0 20px 0;">Welcome to ShopBeta. To verify your email address, use the token below:</p>

    <div style="background-color: #f5f5f5; border-left: 3px solid #1a1a1a; padding: 14px 18px; margin-bottom: 24px; font-family: 'Courier New', Courier, monospace; font-size: 15px; letter-spacing: 0.04em;">
      {{ USER_TOKEN }}
    </div>

    <p style="margin: 0 0 20px 0;">If you didn't create an account with ShopBeta, you can safely ignore this email.</p>

    <p style="margin: 0 0 32px 0;">Welcome aboard.</p>

    <p style="margin: 0 0 4px 0;">The ShopBeta Team</p>


  </div>

</html>
